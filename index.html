<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bağlantılarım</title>
    <!-- Logolar için FontAwesome kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #2c2c2c;
            margin-bottom: 20px;
            object-fit: cover;
            border: 3px solid #444;
        }
        .title {
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .link-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            background-color: #1e1e1e;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 1px solid #333;
        }
        .link-btn:hover {
            background-color: #333;
            transform: translateY(-2px);
        }
        .link-btn i {
            font-size: 24px;
            width: 40px;
            text-align: center;
        }
        .link-text {
            flex-grow: 1;
            text-align: center;
            padding-right: 40px; /* Yazıyı tam ortalamak için ikon genişliği kadar boşluk */
            font-weight: 500;
        }
        /* Minimalist Buton Arka Planı (Orijinal Koyu) */
        .btn-web, .btn-ig, .btn-x, .btn-tt, .btn-fb {
        background-color: #1e1e1e;
        border: 1px solid #333;
        }

        /* Sadece İkonlara Renk Verilmesi */
        .btn-web i { color: #4CAF50; }

        .btn-ig i { 
        background: -webkit-linear-gradient(45deg, #f09433, #dc2743, #bc1888);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        }

        .btn-x i { color: #ffffff; }

        .btn-tt i { 
        color: #ffffff;
        text-shadow: 1.5px 1.5px 0px #fe2c55, -1.5px -1.5px 0px #25F4EE;
        }

        .btn-fb i { color: #1877F2; }

        /* Daha Sade Hover (Üzerine Gelme) Efekti */
        .link-btn:hover {
        transform: translateY(-2px);
        background-color: #2a2a2a;
        border-color: #555;
        }

    </style>
</head>
<body>

    <!-- Kendi profil veya şirket logonun linkini buraya ekleyebilirsin -->
    <img src="logo.png" alt="Logo" class="profile-img">
    
    <div class="title">Hoş Geldiniz</div>

    <div class="link-container">
        <!-- Web Sitesi -->
        <a href="#" target="_blank" class="link-btn btn-web">
            <i class="fas fa-globe"></i>
            <span class="link-text">Web Sitemiz</span>
        </a>
        
        <!-- Instagram -->
        <a href="#" target="_blank" class="link-btn btn-ig">
            <i class="fab fa-instagram"></i>
            <span class="link-text">Instagram</span>
        </a>

        <!-- X (Twitter) -->
        <a href="#" target="_blank" class="link-btn btn-x">
            <i class="fa-brands fa-x-twitter"></i>
            <span class="link-text">X (Twitter)</span>
        </a>

        <!-- TikTok -->
        <a href="#" target="_blank" class="link-btn btn-tt">
            <i class="fab fa-tiktok"></i>
            <span class="link-text">TikTok</span>
        </a>

        <!-- Facebook -->
        <a href="#" target="_blank" class="link-btn btn-fb">
            <i class="fab fa-facebook-f"></i>
            <span class="link-text">Facebook</span>
        </a>
    </div>

</body>
</html>
